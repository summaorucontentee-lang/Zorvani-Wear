<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Jack & Jones Pleated Wide Leg - Dark Wash - Detail View</title>
  <desc>Detail view of Jack & Jones Pleated Wide Leg - Dark Wash. Category: Pants. Color: Dark Wash. This is a demo product image.</desc>
  
  <rect width="800" height="800" fill="#F5F5F5"/>
  
    <!-- Waistband close-up -->
    <rect x="150" y="250" width="500" height="80" rx="8" fill="#273760" stroke="#1e2b4a" stroke-width="2.5"/>
    <!-- Belt loops close -->
    <rect x="220" y="240" width="18" height="100" rx="3" fill="#233155" stroke="#1c2845" stroke-width="1"/>
    <rect x="390" y="240" width="18" height="100" rx="3" fill="#233155" stroke="#1c2845" stroke-width="1"/>
    <rect x="560" y="240" width="18" height="100" rx="3" fill="#233155" stroke="#1c2845" stroke-width="1"/>
    <!-- Zipper/fly area -->
    <rect x="370" y="330" width="60" height="120" rx="3" fill="#283962" stroke="#233155" stroke-width="1.5"/>
    <line x1="400" y1="340" x2="400" y2="440" stroke="#1e2b4a" stroke-width="2"/>
    <!-- Button -->
    <circle cx="400" cy="290" r="12" fill="#1e2b4a" stroke="#1a2540" stroke-width="1.5"/>
    <!-- Fabric below -->
    <rect x="150" y="330" width="220" height="200" fill="#2C3E6B" stroke="none"/>
    <rect x="430" y="330" width="220" height="200" fill="#2C3E6B" stroke="none"/>
  <text x="400" y="720" text-anchor="middle" font-size="12" fill="#999" font-family="sans-serif">Jack & Jones Pleated Wide Leg - Dark Wash</text>
  <text x="400" y="740" text-anchor="middle" font-size="10" fill="#BBB" font-family="sans-serif">Detail View • DEMO</text>

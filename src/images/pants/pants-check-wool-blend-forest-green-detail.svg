<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Check Wool Blend - Forest Green - Detail View</title>
  <desc>Detail view of Check Wool Blend - Forest Green. Category: Pants. Color: Forest Green. This is a demo product image.</desc>
  <defs><pattern id="pat-121-detail" patternUnits="userSpaceOnUse" width="24" height="24"><rect width="24" height="24" fill="#228B22"/><rect width="12" height="12" fill="#1c761c"/><rect x="12" y="12" width="12" height="12" fill="#1c761c"/></pattern></defs>
  <rect width="800" height="800" fill="#F5F5F5"/>
  
    <!-- Waistband close-up -->
    <rect x="150" y="250" width="500" height="80" rx="8" fill="#1e7d1e" stroke="#176117" stroke-width="2.5"/>
    <!-- Belt loops close -->
    <rect x="220" y="240" width="18" height="100" rx="3" fill="#1b6f1b" stroke="#165a16" stroke-width="1"/>
    <rect x="390" y="240" width="18" height="100" rx="3" fill="#1b6f1b" stroke="#165a16" stroke-width="1"/>
    <rect x="560" y="240" width="18" height="100" rx="3" fill="#1b6f1b" stroke="#165a16" stroke-width="1"/>
    <!-- Zipper/fly area -->
    <rect x="370" y="330" width="60" height="120" rx="3" fill="#1f7f1f" stroke="#1b6f1b" stroke-width="1.5"/>
    <line x1="400" y1="340" x2="400" y2="440" stroke="#176117" stroke-width="2"/>
    <!-- Button -->
    <circle cx="400" cy="290" r="12" fill="#176117" stroke="#145314" stroke-width="1.5"/>
    <!-- Fabric below -->
    <rect x="150" y="330" width="220" height="200" fill="url(#pat-121-detail)" stroke="none"/>
    <rect x="430" y="330" width="220" height="200" fill="url(#pat-121-detail)" stroke="none"/>
  <text x="400" y="720" text-anchor="middle" font-size="12" fill="#999" font-family="sans-serif">Check Wool Blend - Forest Green</text>
  <text x="400" y="740" text-anchor="middle" font-size="10" fill="#BBB" font-family="sans-serif">Detail View • DEMO</text>
</svg>
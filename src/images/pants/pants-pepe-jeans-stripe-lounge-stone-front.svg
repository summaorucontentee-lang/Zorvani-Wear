    <rect x="260" y="175" width="12" height="60" rx="2" fill="#74716a"/>
    <rect x="395" y="175" width="12" height="60" rx="2" fill="#74716a"/>
    <rect x="530" y="175" width="12" height="60" rx="2" fill="#74716a"/>

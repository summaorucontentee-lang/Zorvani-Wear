<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>U.S. Polo Assn. Slim Chinos - Khaki - Side View</title>
  <desc>Side view of U.S. Polo Assn. Slim Chinos - Khaki. Category: Pants. Color: Khaki. This is a demo product image.</desc>
  <defs>
    <!-- Soft Studio Radial Backdrop -->
    <radialGradient id="studio-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <filter id="shadow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  
  
  <!-- Clean Studio Canvas -->
  <rect width="800" height="800" fill="url(#studio-bg)"/>
  
  <!-- Subtle Framing Pedestal / Vignette -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6"/>
  
  <!-- Apparel / Footwear Artwork -->
  
    <ellipse cx="400" cy="650" rx="160" ry="18" fill="#000000" opacity="0.12" filter="url(#shadow-filter)"/>
    <!-- Elegant Side Profile -->
    <path d="M360 180 L440 180 Q465 240 455 640 L375 640 Q350 400 345 240 Z" fill="#A89472" stroke="#645844" stroke-width="2.5"/>
    <rect x="350" y="180" width="95" height="48" rx="4" fill="#978566" stroke="#645844" stroke-width="2"/>
    <!-- Outer Side Seam with Double Stitching -->
    <line x1="410" y1="228" x2="410" y2="640" stroke="#645844" stroke-width="2"/>
    <line x1="414" y1="228" x2="414" y2="640" stroke="#D69E2E" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.7"/>
    <!-- Side Pocket -->
    <path d="M410 240 L370 290" stroke="#645844" stroke-width="2.5"/>
    <!-- Turn-up Hem Cuff -->
    <rect x="370" y="615" width="90" height="25" fill="#8e7d60" stroke="#645844" stroke-width="2"/>
  
  
  <!-- Minimalist Luxury Watermark / Tag -->
  <rect x="250" y="722" width="300" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" opacity="0.95"/>
  <text x="400" y="743" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A" letter-spacing="1.5" font-family="sans-serif">U.S. POLO ASSN. SLIM CHINOS - KHAKI</text>
  <text x="400" y="775" text-anchor="middle" font-size="10" fill="#94A3B8" letter-spacing="1" font-family="sans-serif">SIDE VIEW • DEMO STORE</text>
</svg>
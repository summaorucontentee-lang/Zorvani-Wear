  <defs><linearGradient id="pat-105-back" x1="0" y1="0" x2="0" y2="1"><stop offset="50%" stop-color="#D4C5A9"/><stop offset="50%" stop-color="#89806d"/></linearGradient></defs>
  <rect width="800" height="800" fill="#F5F5F5"/>
  
    <!-- Waistband back -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Pepe Jeans Stripe Lounge - Stone - Detail View</title>
  <desc>Detail view of Pepe Jeans Stripe Lounge - Stone. Category: Pants. Color: Stone. This is a demo product image.</desc>
  <defs><pattern id="pat-117-detail" patternUnits="userSpaceOnUse" width="20" height="20"><rect width="20" height="20" fill="#928E85"/><line x1="0" y1="10" x2="20" y2="10" stroke="#66635d" stroke-width="3"/></pattern></defs>
  <rect width="800" height="800" fill="#F5F5F5"/>
  
    <!-- Waistband close-up -->
    <rect x="150" y="250" width="500" height="80" rx="8" fill="#837f77" stroke="#66635d" stroke-width="2.5"/>
    <!-- Belt loops close -->
    <rect x="220" y="240" width="18" height="100" rx="3" fill="#74716a" stroke="#5e5c56" stroke-width="1"/>
    <rect x="390" y="240" width="18" height="100" rx="3" fill="#74716a" stroke="#5e5c56" stroke-width="1"/>
    <rect x="560" y="240" width="18" height="100" rx="3" fill="#74716a" stroke="#5e5c56" stroke-width="1"/>
    <!-- Zipper/fly area -->
    <rect x="370" y="330" width="60" height="120" rx="3" fill="#86827a" stroke="#74716a" stroke-width="1.5"/>
    <line x1="400" y1="340" x2="400" y2="440" stroke="#66635d" stroke-width="2"/>
    <!-- Button -->
    <circle cx="400" cy="290" r="12" fill="#66635d" stroke="#57554f" stroke-width="1.5"/>
    <!-- Fabric below -->
    <rect x="150" y="330" width="220" height="200" fill="url(#pat-117-detail)" stroke="none"/>
    <rect x="430" y="330" width="220" height="200" fill="url(#pat-117-detail)" stroke="none"/>
  <text x="400" y="720" text-anchor="middle" font-size="12" fill="#999" font-family="sans-serif">Pepe Jeans Stripe Lounge - Stone</text>
  <text x="400" y="740" text-anchor="middle" font-size="10" fill="#BBB" font-family="sans-serif">Detail View • DEMO</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Tommy Hilfiger Linen Drawstring - Light Wash - Back View</title>
  <desc>Back view of Tommy Hilfiger Linen Drawstring - Light Wash. Category: Pants. Color: Light Wash. This is a demo product image.</desc>
  <defs>
    <!-- Soft Studio Radial Backdrop -->
    <radialGradient id="studio-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <filter id="shadow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  
  
  <!-- Clean Studio Canvas -->
  <rect width="800" height="800" fill="url(#studio-bg)"/>
  
  <!-- Subtle Framing Pedestal / Vignette -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6"/>
  
  <!-- Apparel / Footwear Artwork -->
  
    <ellipse cx="400" cy="660" rx="190" ry="20" fill="#000000" opacity="0.12" filter="url(#shadow-filter)"/>
    <path d="M240 230 L260 645 L385 645 L395 380 L350 230 Z" fill="#6F8FAF" stroke="#425569" stroke-width="2.5"/>
    <path d="M450 230 L405 380 L415 645 L540 645 L560 230 Z" fill="#6F8FAF" stroke="#425569" stroke-width="2.5"/>
    <path d="M350 230 L395 380 L405 380 L450 230 Z" fill="#6F8FAF"/>
    <rect x="235" y="180" width="330" height="52" rx="4" fill="#63809d" stroke="#425569" stroke-width="2.5"/>
    <!-- Leather Brand Patch -->
    <rect x="475" y="184" width="70" height="44" rx="3" fill="#8B4513" stroke="#5C2C0A" stroke-width="1.5"/>
    <text x="510" y="210" text-anchor="middle" font-size="8" font-weight="bold" fill="#F7FAFC" font-family="sans-serif">ZORVANI</text>
    <!-- Back Yoke V-Seam -->
    <path d="M235 250 L400 280 L565 250" stroke="#425569" stroke-width="2" fill="none"/>
    <!-- Back Pockets -->
    <path d="M270 290 L345 290 L345 365 L307 385 L270 365 Z" fill="#6987a6" stroke="#425569" stroke-width="2"/>
    <path d="M275 325 Q307 350 340 325" stroke="#D69E2E" stroke-width="1.5" fill="none"/>
    <path d="M455 290 L530 290 L530 365 L492 385 L455 365 Z" fill="#6987a6" stroke="#425569" stroke-width="2"/>
    <path d="M460 325 Q492 350 525 325" stroke="#D69E2E" stroke-width="1.5" fill="none"/>
  
  
  <!-- Minimalist Luxury Watermark / Tag -->
  <rect x="250" y="722" width="300" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" opacity="0.95"/>
  <text x="400" y="743" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A" letter-spacing="1.5" font-family="sans-serif">TOMMY HILFIGER LINEN DRAWSTRING - LIGHT WASH</text>
  <text x="400" y="775" text-anchor="middle" font-size="10" fill="#94A3B8" letter-spacing="1" font-family="sans-serif">BACK VIEW • DEMO STORE</text>
</svg>
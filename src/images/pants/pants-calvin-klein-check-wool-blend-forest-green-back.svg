<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Calvin Klein Check Wool Blend - Forest Green - Back View</title>
  <desc>Back view of Calvin Klein Check Wool Blend - Forest Green. Category: Pants. Color: Forest Green. This is a demo product image.</desc>
  <defs><pattern id="pat-121-back" patternUnits="userSpaceOnUse" width="24" height="24"><rect width="24" height="24" fill="#228B22"/><rect width="12" height="12" fill="#1c761c"/><rect x="12" y="12" width="12" height="12" fill="#1c761c"/></pattern></defs>
  <rect width="800" height="800" fill="#F5F5F5"/>
  
    <!-- Waistband back -->
    <rect x="220" y="180" width="360" height="50" rx="5" fill="#1e7d1e" stroke="#176117" stroke-width="2"/>
    <!-- Belt loops -->
    <rect x="260" y="175" width="12" height="60" rx="2" fill="#1b6f1b"/>
    <rect x="530" y="175" width="12" height="60" rx="2" fill="#1b6f1b"/>
    <!-- Left leg -->
    <path d="M220 230 L240 650 L380 650 L400 400 Z" fill="url(#pat-121-back)" stroke="#176117" stroke-width="2"/>
    <!-- Right leg -->
    <path d="M400 400 L420 650 L560 650 L580 230 Z" fill="url(#pat-121-back)" stroke="#176117" stroke-width="2"/>
    <!-- Back pockets -->
    <rect x="270" y="280" width="90" height="80" rx="5" fill="none" stroke="#196819" stroke-width="1.5"/>
    <rect x="440" y="280" width="90" height="80" rx="5" fill="none" stroke="#196819" stroke-width="1.5"/>
    <!-- Pocket stitching -->
    <path d="M280 320 L350 320" stroke="#176117" stroke-width="1" stroke-dasharray="3,2"/>
    <path d="M450 320 L520 320" stroke="#176117" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="400" y="720" text-anchor="middle" font-size="12" fill="#999" font-family="sans-serif">Calvin Klein Check Wool Blend - Forest Green</text>
  <text x="400" y="740" text-anchor="middle" font-size="10" fill="#BBB" font-family="sans-serif">Back View • DEMO</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Wrangler Cargo Pants - Olive - Detail View</title>
  <desc>Detail view of Wrangler Cargo Pants - Olive. Category: Pants. Color: Olive. This is a demo product image.</desc>
  
  <rect width="800" height="800" fill="#F5F5F5"/>
  
    <!-- Waistband close-up -->
    <rect x="150" y="250" width="500" height="80" rx="8" fill="#737300" stroke="#595900" stroke-width="2.5"/>
    <!-- Belt loops close -->
    <rect x="220" y="240" width="18" height="100" rx="3" fill="#666600" stroke="#535300" stroke-width="1"/>
    <rect x="390" y="240" width="18" height="100" rx="3" fill="#666600" stroke="#535300" stroke-width="1"/>
    <rect x="560" y="240" width="18" height="100" rx="3" fill="#666600" stroke="#535300" stroke-width="1"/>
    <!-- Zipper/fly area -->
    <rect x="370" y="330" width="60" height="120" rx="3" fill="#757500" stroke="#666600" stroke-width="1.5"/>
    <line x1="400" y1="340" x2="400" y2="440" stroke="#595900" stroke-width="2"/>
    <!-- Button -->
    <circle cx="400" cy="290" r="12" fill="#595900" stroke="#4c4c00" stroke-width="1.5"/>
    <!-- Fabric below -->
    <rect x="150" y="330" width="220" height="200" fill="#808000" stroke="none"/>
    <rect x="430" y="330" width="220" height="200" fill="#808000" stroke="none"/>
  <text x="400" y="720" text-anchor="middle" font-size="12" fill="#999" font-family="sans-serif">Wrangler Cargo Pants - Olive</text>
  <text x="400" y="740" text-anchor="middle" font-size="10" fill="#BBB" font-family="sans-serif">Detail View • DEMO</text>
</svg>
    <path d="M460 240 L460 320 L550 340 L550 240" fill="none" stroke="#2b373f" stroke-width="1.5"/>
  <text x="400" y="720" text-anchor="middle" font-size="12" fill="#999" font-family="sans-serif">Tailored Formal - Charcoal</text>
  <text x="400" y="740" text-anchor="middle" font-size="10" fill="#BBB" font-family="sans-serif">Front View • DEMO</text>

  <rect width="800" height="800" fill="#F5F5F5"/>
  
    <!-- Waistband -->
    <rect x="220" y="180" width="360" height="50" rx="5" fill="#303e47" stroke="#253037" stroke-width="2"/>
    <!-- Belt loops -->
    <rect x="260" y="175" width="12" height="60" rx="2" fill="#2b373f"/>
    <rect x="395" y="175" width="12" height="60" rx="2" fill="#2b373f"/>

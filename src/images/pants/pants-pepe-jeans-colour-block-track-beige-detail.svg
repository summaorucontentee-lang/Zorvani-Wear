<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Pepe Jeans Colour Block Track - Beige - Detail View</title>
  <desc>Detail view of Pepe Jeans Colour Block Track - Beige. Category: Pants. Color: Beige. This is a demo product image.</desc>
  <defs>
    <!-- Soft Studio Radial Backdrop -->
    <radialGradient id="studio-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <filter id="shadow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <defs><linearGradient id="pat-105-detail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1c6aa"/>
      <stop offset="48%" stop-color="#C9BC9C"/>
      <stop offset="52%" stop-color="#8c836d"/>
      <stop offset="100%" stop-color="#6e6755"/>
    </linearGradient></defs>
  
  <!-- Clean Studio Canvas -->
  <rect width="800" height="800" fill="url(#studio-bg)"/>
  
  <!-- Subtle Framing Pedestal / Vignette -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6"/>
  
  <!-- Apparel / Footwear Artwork -->
  
    <!-- Close-Up Waist & Front Pocket Details -->
    <rect x="160" y="180" width="480" height="440" rx="20" fill="url(#pat-105-detail)" stroke="#78705d" stroke-width="3"/>
    <rect x="160" y="180" width="480" height="90" fill="#b4a98c" stroke="#78705d" stroke-width="2"/>
    <!-- Belt Loop -->
    <rect x="310" y="170" width="22" height="110" rx="3" fill="#968d75" stroke="#78705d" stroke-width="1.5"/>
    <line x1="310" y1="180" x2="332" y2="180" stroke="#F6AD55" stroke-width="3"/>
    <line x1="310" y1="270" x2="332" y2="270" stroke="#F6AD55" stroke-width="3"/>
    <!-- Large Antique Brass Button -->
    <circle cx="440" cy="225" r="24" fill="#D69E2E" stroke="#5C3B0E" stroke-width="3"/>
    <circle cx="440" cy="225" r="16" fill="#B7791F"/>
    <text x="440" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#5C3B0E" font-family="sans-serif">ZW 26</text>
    <!-- Coin Pocket Detail -->
    <rect x="190" y="320" width="110" height="85" rx="4" fill="#b8ac8f" stroke="#78705d" stroke-width="2"/>
    <circle cx="205" cy="335" r="5" fill="#D69E2E"/>
    <circle cx="285" cy="335" r="5" fill="#D69E2E"/>
    <!-- Rivet Contrast -->
    <line x1="190" y1="360" x2="300" y2="360" stroke="#F6AD55" stroke-width="2" stroke-dasharray="4,2"/>
  
  
  <!-- Minimalist Luxury Watermark / Tag -->
  <rect x="250" y="722" width="300" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" opacity="0.95"/>
  <text x="400" y="743" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A" letter-spacing="1.5" font-family="sans-serif">PEPE JEANS COLOUR BLOCK TRACK - BEIGE</text>
  <text x="400" y="775" text-anchor="middle" font-size="10" fill="#94A3B8" letter-spacing="1" font-family="sans-serif">DETAIL VIEW • DEMO STORE</text>

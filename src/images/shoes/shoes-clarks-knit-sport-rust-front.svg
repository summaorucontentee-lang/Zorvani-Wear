<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Clarks Knit Sport - Rust - Front View</title>
  <desc>Front view of Clarks Knit Sport - Rust. Category: Shoes. Color: Rust. This is a demo product image.</desc>
  
  <rect width="800" height="800" fill="#F5F5F5"/>
  
    <!-- Shoe top-front view -->
    <ellipse cx="400" cy="500" rx="180" ry="60" fill="#a43a0c" stroke="#802d09" stroke-width="2"/>
    <!-- Shoe upper -->
    <path d="M220 500 L240 350 L350 300 L400 290 L450 300 L560 350 L580 500 Z" fill="#B7410E" stroke="#802d09" stroke-width="2"/>
    <!-- Toe box -->
    <ellipse cx="400" cy="340" rx="80" ry="30" fill="#be5426" stroke="#92340b" stroke-width="1.5"/>
    <!-- Lacing area -->
    <line x1="380" y1="350" x2="420" y2="350" stroke="#6d2708" stroke-width="2"/>
    <line x1="375" y1="370" x2="425" y2="370" stroke="#6d2708" stroke-width="2"/>
    <line x1="370" y1="390" x2="430" y2="390" stroke="#6d2708" stroke-width="2"/>
    <line x1="365" y1="410" x2="435" y2="410" stroke="#6d2708" stroke-width="2"/>
    <!-- Tongue -->
    <path d="M375 350 L400 310 L425 350" fill="#c5673e" stroke="#92340b" stroke-width="1"/>
  <text x="400" y="720" text-anchor="middle" font-size="12" fill="#999" font-family="sans-serif">Clarks Knit Sport - Rust</text>
  <text x="400" y="740" text-anchor="middle" font-size="10" fill="#BBB" font-family="sans-serif">Front View • DEMO</text>
</svg>
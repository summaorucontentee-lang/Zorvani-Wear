  <rect width="800" height="800" fill="#F5F5F5"/>
  
    <!-- Sole back -->
    <rect x="250" y="510" width="300" height="30" rx="5" fill="#999999" stroke="#7f7f7f" stroke-width="2"/>
    <!-- Heel counter -->
    <path d="M270 510 L270 370 L330 340 L400 330 L470 340 L530 370 L530 510 Z" fill="#FFFFFF" stroke="#b2b2b2" stroke-width="2"/>

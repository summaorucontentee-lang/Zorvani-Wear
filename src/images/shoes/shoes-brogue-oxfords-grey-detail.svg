  <rect width="800" height="800" fill="#F5F5F5"/>
  
    <!-- Sole pattern close-up -->
    <rect x="200" y="250" width="400" height="300" rx="20" fill="#515151" stroke="#444444" stroke-width="2.5"/>
    <!-- Tread pattern -->
    <line x1="230" y1="290" x2="570" y2="290" stroke="#5f5f5f" stroke-width="3"/>
    <line x1="230" y1="330" x2="570" y2="330" stroke="#5f5f5f" stroke-width="3"/>
    <line x1="230" y1="370" x2="570" y2="370" stroke="#5f5f5f" stroke-width="3"/>
    <line x1="230" y1="410" x2="570" y2="410" stroke="#5f5f5f" stroke-width="3"/>
    <line x1="230" y1="450" x2="570" y2="450" stroke="#5f5f5f" stroke-width="3"/>
    <line x1="230" y1="490" x2="570" y2="490" stroke="#5f5f5f" stroke-width="3"/>
    <!-- Cross treads -->
    <line x1="300" y1="260" x2="300" y2="540" stroke="#5f5f5f" stroke-width="2"/>
    <line x1="400" y1="260" x2="400" y2="540" stroke="#5f5f5f" stroke-width="2"/>
    <line x1="500" y1="260" x2="500" y2="540" stroke="#5f5f5f" stroke-width="2"/>
    <!-- Brand circle -->
    <circle cx="400" cy="400" r="40" fill="#585858" stroke="#444444" stroke-width="2"/>
    <text x="400" y="405" text-anchor="middle" font-size="14" fill="#ababab" font-family="sans-serif" font-weight="bold">ZW</text>
  <text x="400" y="720" text-anchor="middle" font-size="12" fill="#999" font-family="sans-serif">Brogue Oxfords - Grey</text>
  <text x="400" y="740" text-anchor="middle" font-size="10" fill="#BBB" font-family="sans-serif">Detail View • DEMO</text>

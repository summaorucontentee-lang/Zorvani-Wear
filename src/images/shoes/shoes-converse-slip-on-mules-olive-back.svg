    <text x="400" y="350" text-anchor="middle" font-size="10" fill="#4c4c00" font-family="sans-serif">ZW</text>
    <!-- Heel accent -->
    <path d="M290 480 L510 480" stroke="#666600" stroke-width="1.5"/>

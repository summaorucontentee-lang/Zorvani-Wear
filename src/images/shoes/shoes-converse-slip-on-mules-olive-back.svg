  <text x="400" y="720" text-anchor="middle" font-size="12" fill="#999" font-family="sans-serif">Converse Slip-On Mules - Olive</text>
  <text x="400" y="740" text-anchor="middle" font-size="10" fill="#BBB" font-family="sans-serif">Back View • DEMO</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Van Heusen Check Casual - Lavender - Detail View</title>
  <desc>Detail view of Van Heusen Check Casual - Lavender. Category: Shirts. Color: Lavender. This is a demo product image.</desc>
  <defs>
    <!-- Soft Studio Radial Backdrop -->
    <radialGradient id="studio-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <filter id="shadow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <defs><pattern id="pat-18-detail" patternUnits="userSpaceOnUse" width="36" height="36">
      <rect width="36" height="36" fill="#9F90C2"/>
      <rect width="18" height="18" fill="#82769f"/>
      <rect x="18" y="18" width="18" height="18" fill="#82769f"/>
      <line x1="0" y1="18" x2="36" y2="18" stroke="#675d7e" stroke-width="1.5"/>
      <line x1="18" y1="0" x2="18" y2="36" stroke="#675d7e" stroke-width="1.5"/>
    </pattern></defs>
  
  <!-- Clean Studio Canvas -->
  <rect width="800" height="800" fill="url(#studio-bg)"/>
  
  <!-- Subtle Framing Pedestal / Vignette -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6"/>
  
  <!-- Apparel / Footwear Artwork -->
  
    <!-- Macro View of Collar & Placket -->
    <rect x="160" y="160" width="480" height="480" rx="24" fill="url(#pat-18-detail)" stroke="#675d7e" stroke-width="3"/>
    <!-- Collar Spread Macro -->
    <path d="M210 220 L370 380 L395 320 L270 200 Z" fill="#bbb1d4" stroke="#675d7e" stroke-width="3"/>
    <path d="M590 220 L430 380 L405 320 L530 200 Z" fill="#bbb1d4" stroke="#675d7e" stroke-width="3"/>
    <!-- Placket Macro -->
    <rect x="365" y="240" width="70" height="400" fill="#ada0cb" stroke="#675d7e" stroke-width="2.5"/>
    <line x1="375" y1="240" x2="375" y2="640" stroke="#675d7e" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="425" y1="240" x2="425" y2="640" stroke="#675d7e" stroke-width="1.5" stroke-dasharray="4,4"/>
    <!-- Button Close-Up -->
    <circle cx="400" cy="400" r="22" fill="#FFFFFF" stroke="#675d7e" stroke-width="3"/>
    <circle cx="400" cy="400" r="14" fill="#EDF2F7" stroke="#675d7e" stroke-width="1"/>
    <circle cx="394" cy="394" r="2.5" fill="#1A202C"/>
    <circle cx="406" cy="394" r="2.5" fill="#1A202C"/>
    <circle cx="394" cy="406" r="2.5" fill="#1A202C"/>
    <circle cx="406" cy="406" r="2.5" fill="#1A202C"/>
    <!-- Woven Brand Label Inside -->
    <rect x="330" y="170" width="140" height="50" rx="4" fill="#1A202C"/>
    <text x="400" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="sans-serif">ZORVANI</text>
    <text x="400" y="214" text-anchor="middle" font-size="10" fill="#E2E8F0" font-family="sans-serif">EST. 2026 • 100% COTTON</text>
  
  
  <!-- Minimalist Luxury Watermark / Tag -->
  <rect x="250" y="722" width="300" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" opacity="0.95"/>
  <text x="400" y="743" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A" letter-spacing="1.5" font-family="sans-serif">VAN HEUSEN CHECK CASUAL - LAVENDER</text>
  <text x="400" y="775" text-anchor="middle" font-size="10" fill="#94A3B8" letter-spacing="1" font-family="sans-serif">DETAIL VIEW • DEMO STORE</text>
</svg>
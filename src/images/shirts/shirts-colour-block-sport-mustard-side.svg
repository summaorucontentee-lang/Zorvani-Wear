<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Colour Block Sport - Mustard - Side View</title>
  <desc>Side view of Colour Block Sport - Mustard. Category: Shirts. Color: Mustard. This is a demo product image.</desc>
  <defs><linearGradient id="pat-19-side" x1="0" y1="0" x2="0" y2="1"><stop offset="50%" stop-color="#D4A843"/><stop offset="50%" stop-color="#896d2b"/></linearGradient></defs>
  <rect width="800" height="800" fill="#F5F5F5"/>
  
    <!-- Folded shirt -->
    <rect x="200" y="300" width="400" height="250" rx="10" fill="url(#pat-19-side)" stroke="#94752e" stroke-width="2"/>
    <!-- Fold lines -->
    <path d="M200 380 L600 380" stroke="#b48e38" stroke-width="1.5"/>
    <path d="M200 450" stroke="#b48e38" stroke-width="1"/>
    <!-- Collar peeking -->
    <path d="M250 300 L350 280 L400 295 L450 280 L550 300" fill="none" stroke="#94752e" stroke-width="2"/>
    <!-- Sleeve fold -->
    <rect x="220" y="310" width="80" height="40" rx="5" fill="#dab55f" stroke="#a98635" stroke-width="1"/>
  <text x="400" y="720" text-anchor="middle" font-size="12" fill="#999" font-family="sans-serif">Colour Block Sport - Mustard</text>
  <text x="400" y="740" text-anchor="middle" font-size="10" fill="#BBB" font-family="sans-serif">Side View • DEMO</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>H&M Classic Oxford - White - Back View</title>
  <desc>Back view of H&M Classic Oxford - White. Category: Shirts. Color: White. This is a demo product image.</desc>
  <defs>
    <!-- Soft Studio Radial Backdrop -->
    <radialGradient id="studio-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <filter id="shadow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  
  
  <!-- Clean Studio Canvas -->
  <rect width="800" height="800" fill="url(#studio-bg)"/>
  
  <!-- Subtle Framing Pedestal / Vignette -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6"/>
  
  <!-- Apparel / Footwear Artwork -->
  
    <ellipse cx="400" cy="640" rx="210" ry="22" fill="#000000" opacity="0.12" filter="url(#shadow-filter)"/>
    <path d="M290 190 Q220 220 180 260 L195 590 Q400 625 605 590 L620 260 Q580 220 510 190 Q450 175 400 175 Q350 175 290 190 Z" fill="#F4F5F7" stroke="#9e9fa0" stroke-width="2.5"/>
    <!-- Back Yoke -->
    <path d="M185 270 Q400 295 615 270" stroke="#9e9fa0" stroke-width="2.5" fill="none"/>
    <line x1="185" y1="274" x2="615" y2="274" stroke="#9e9fa0" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <!-- Box Pleat -->
    <line x1="400" y1="290" x2="400" y2="570" stroke="#9e9fa0" stroke-width="2" opacity="0.5"/>
    <!-- Sleeves -->
    <path d="M190 250 L110 330 Q125 410 155 430 L195 385 Z" fill="#F4F5F7" stroke="#9e9fa0" stroke-width="2"/>
    <path d="M610 250 L690 330 Q675 410 645 430 L605 385 Z" fill="#F4F5F7" stroke="#9e9fa0" stroke-width="2"/>
    <!-- Collar Band Back -->
    <path d="M320 190 Q400 205 480 190" stroke="#9e9fa0" stroke-width="4" fill="none"/>
  
  
  <!-- Minimalist Luxury Watermark / Tag -->
  <rect x="250" y="722" width="300" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" opacity="0.95"/>
  <text x="400" y="743" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B2A4A" letter-spacing="1.5" font-family="sans-serif">H&M CLASSIC OXFORD - WHITE</text>
  <text x="400" y="775" text-anchor="middle" font-size="10" fill="#94A3B8" letter-spacing="1" font-family="sans-serif">BACK VIEW • DEMO STORE</text>
</svg>
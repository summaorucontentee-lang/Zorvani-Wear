  <defs><pattern id="pat-18-side" patternUnits="userSpaceOnUse" width="24" height="24"><rect width="24" height="24" fill="#B8A9D0"/><rect width="12" height="12" fill="#9c8fb0"/><rect x="12" y="12" width="12" height="12" fill="#9c8fb0"/></pattern></defs>
  <rect width="800" height="800" fill="#F5F5F5"/>
  

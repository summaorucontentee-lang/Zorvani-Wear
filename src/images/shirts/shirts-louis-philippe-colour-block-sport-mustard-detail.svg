<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Louis Philippe Colour Block Sport - Mustard - Detail View</title>
  <desc>Detail view of Louis Philippe Colour Block Sport - Mustard. Category: Shirts. Color: Mustard. This is a demo product image.</desc>
  <defs><linearGradient id="pat-8-detail" x1="0" y1="0" x2="0" y2="1"><stop offset="50%" stop-color="#D4A843"/><stop offset="50%" stop-color="#896d2b"/></linearGradient></defs>
  <rect width="800" height="800" fill="#F5F5F5"/>
  
    <!-- Close-up collar area -->
    <path d="M200 350 L340 250 L400 300 L460 250 L600 350 L540 400 L460 360 L400 380 L340 360 L260 400 Z" fill="#e5ca8e" stroke="#94752e" stroke-width="2.5"/>
    <!-- Collar stand -->
    <path d="M280 370 L520 370" stroke="#a98635" stroke-width="2"/>
    <!-- Placket -->
    <rect x="385" y="370" width="30" height="250" fill="#e0c27b" stroke="#a98635" stroke-width="1.5"/>
    <!-- Buttons close-up -->
    <circle cx="400" cy="420" r="8" fill="#7f6428" stroke="#6a5421" stroke-width="1"/>
    <circle cx="400" cy="480" r="8" fill="#7f6428" stroke="#6a5421" stroke-width="1"/>
    <circle cx="400" cy="540" r="8" fill="#7f6428" stroke="#6a5421" stroke-width="1"/>
    <!-- Button holes -->
    <line x1="396" y1="420" x2="404" y2="420" stroke="#e0c27b" stroke-width="1.5"/>
    <line x1="396" y1="480" x2="404" y2="480" stroke="#e0c27b" stroke-width="1.5"/>
    <line x1="396" y1="540" x2="404" y2="540" stroke="#e0c27b" stroke-width="1.5"/>
    <!-- Fabric area -->
    <rect x="200" y="370" width="185" height="250" fill="url(#pat-8-detail)" stroke="none"/>
    <rect x="415" y="370" width="185" height="250" fill="url(#pat-8-detail)" stroke="none"/>
  <text x="400" y="720" text-anchor="middle" font-size="12" fill="#999" font-family="sans-serif">Louis Philippe Colour Block Sport - Mustard</text>
  <text x="400" y="740" text-anchor="middle" font-size="10" fill="#BBB" font-family="sans-serif">Detail View • DEMO</text>
